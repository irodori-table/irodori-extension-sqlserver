[package]
name = "irodori-extension-sqlserver"
version = "0.1.7"
publish = false
edition = "2021"
license = "0BSD"
description = "Native Irodori Table connector extension for SQL Server."
repository = "https://github.com/irodori-table/irodori-extension-sqlserver"
readme = "README.md"
include = [
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE-*",
  "connector.config.json",
  "connector.source.json",
  "irodori.extension.json",
  "src/**",
  "native/source/**",
]

[lib]
name = "irodori_extension_sqlserver"
crate-type = ["cdylib", "rlib"]

[dependencies]
irodori-connector-abi = { git = "https://github.com/irodori-table/irodori-kit", tag = "v0.8.1" }
futures-util = "0.3"
serde_json = "1"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "chrono", "native-tls"] }
tokio = { version = "1", features = ["net", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["compat"] }

[profile.dev.package."*"]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
